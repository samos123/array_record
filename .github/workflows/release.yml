name: Release

# Triggers automatically when Copybara (`github_use_app = True`) pushes a commit
# to `main` touching `MODULE.bazel` or `setup.py`:
# - Verifies that `version = "..."` in `MODULE.bazel` matches `version = '...'`
#   in `setup.py` so PyPI and GitHub/BCR releases cannot drift.
# - If `version = "..."` in `MODULE.bazel` does not have an existing `v${VERSION}`
#   tag/release on GitHub, cuts the GitHub Release with `array_record-v${VERSION}.tar.gz`
#   and triggers `publish-bcr`.
# - If `MODULE.bazel` or `setup.py` was modified without bumping `version`
#   (`v${VERSION}` already exists), exits 0 cleanly without overwriting or
#   re-publishing.
on:
  push:
    branches:
      - main
    paths:
      - 'MODULE.bazel'
      - 'setup.py'
  workflow_dispatch:
    inputs:
      registry_fork:
        description: 'Fork of bazel-central-registry to push to'
        required: false
        default: 'samos123/bazel-central-registry'
        type: string
      overwrite_existing:
        description: 'Overwrite existing release/tag if it already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Cut GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      should_release: ${{ steps.cut.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create GitHub Release from MODULE.bazel
        id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE_EXISTING: ${{ inputs.overwrite_existing || 'false' }}
        run: |
          set -euo pipefail

          VERSION="$(sed -n '/module(/,/)/s/.*version *= *"\([^"]*\)".*/\1/p' MODULE.bazel | head -n 1)"
          SETUP_VERSION="$(sed -n "s/.*version *= *'\([^']*\)'.*/\1/p" setup.py | head -n 1)"
          if [ "${VERSION}" != "${SETUP_VERSION}" ]; then
            echo "::error::Version mismatch: MODULE.bazel has '${VERSION:-empty}' but setup.py has '${SETUP_VERSION:-empty}'. Please update both files to the same version."
            exit 1
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "0.0.0" ]; then
            echo "MODULE.bazel version is '${VERSION:-empty}'; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${VERSION}"

          # Never overwrite an already-published release on push (e.g. when MODULE.bazel
          # deps are edited without bumping the module version).
          if gh release view "${TAG}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            if [ "${OVERWRITE_EXISTING}" != "true" ]; then
              echo "Release/tag ${TAG} already exists; skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "overwrite_existing=true: deleting existing release/tag ${TAG}..."
            gh release delete "${TAG}" --cleanup-tag --yes || true
            git push --delete origin "${TAG}" || true
          fi

          echo "Creating release ${TAG}..."

          ARCHIVE="array_record-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="array_record-${TAG}/" -o "${ARCHIVE}" HEAD

          NOTES_FILE="$(mktemp)"
          git log -1 --format=%b HEAD | sed '/^PiperOrigin-RevId:/d' > "${NOTES_FILE}"
          if [ -n "$(sed '/^[[:space:]]*$/d' "${NOTES_FILE}")" ]; then
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" "${ARCHIVE}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --generate-notes
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  publish-bcr:
    name: Publish to Bazel Central Registry
    needs: [release]
    if: needs.release.outputs.should_release == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@ad6879fd015a01c3e3b1b318fe3c061f928ac2fb # v1.4.2
    with:
      tag_name: ${{ needs.release.outputs.tag }}
      # `google/bazel-central-registry` does not exist on GitHub; `publish.yaml`
      # pushes a release branch to `registry_fork` using `BCR_PUBLISH_TOKEN` and
      # opens a PR to `bazelbuild/bazel-central-registry`. Using a fork owned by a
      # maintainer listed in `.bcr/metadata.template.json` (`samos123`) allows BCR CI
      # to auto-trust and run presubmit verification without manual intervention.
      registry_fork: ${{ inputs.registry_fork || 'samos123/bazel-central-registry' }}
      attest: false
      draft: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
